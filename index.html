<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coze AI Chatbot</title>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Marked.js (Markdown) & Highlight.js (Code highlighting) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full bg-[#111216] text-gray-100 flex overflow-hidden font-sans antialiased">

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>

  <!-- Left Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 sm:w-72 bg-[#181a20] border-r border-gray-800 flex flex-col transition-transform duration-200 -translate-x-full lg:translate-x-0 lg:static">
    
    <!-- New Chat Button -->
    <div class="p-3 border-b border-gray-800 flex items-center justify-between gap-2">
      <button id="btn-new-chat" class="flex-1 flex items-center justify-center gap-2 px-3.5 py-2.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white rounded-xl text-sm font-medium transition shadow-sm">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Đoạn chat mới</span>
      </button>

      <button id="btn-close-sidebar" class="lg:hidden p-2 text-gray-400 hover:text-white rounded-lg">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Chat History List -->
    <div class="flex-1 overflow-y-auto p-2.5 space-y-1 custom-scrollbar">
      <div class="px-2 py-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">
        Lịch sử trò chuyện
      </div>
      <div id="chat-history-list" class="space-y-1">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-gray-800 bg-[#14161b] flex items-center justify-between">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold shrink-0">
          U
        </div>
        <div class="min-w-0">
          <p class="text-xs font-medium text-gray-200 truncate">Người dùng</p>
          <p class="text-[11px] text-emerald-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Coze Bot Connected
          </p>
        </div>
      </div>
      <button id="btn-clear-history" title="Xóa tất cả lịch sử chat" class="p-1.5 text-gray-400 hover:text-red-400 hover:bg-gray-800 rounded-lg transition">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col h-full min-w-0 bg-[#111216]">
    
    <!-- Top Bar -->
    <header class="h-14 border-b border-gray-800/80 px-4 flex items-center justify-between bg-[#15171d]/90 backdrop-blur-md sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <button id="btn-open-sidebar" class="lg:hidden p-2 text-gray-400 hover:text-white rounded-lg">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400">
            <i data-lucide="bot" class="w-4 h-4"></i>
          </div>
          <div>
            <h1 id="current-chat-title" class="font-medium text-sm text-gray-100 truncate max-w-[200px] sm:max-w-md">
              Đoạn chat mới
            </h1>
          </div>
        </div>
      </div>

      <button id="btn-open-settings" class="flex items-center gap-1.5 px-3 py-1.5 text-xs text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl transition">
        <i data-lucide="settings" class="w-3.5 h-3.5 text-blue-400"></i>
        <span>Cài đặt Bot</span>
      </button>
    </header>

    <!-- Messages Container -->
    <div id="messages-container" class="flex-1 overflow-y-auto px-4 py-6 custom-scrollbar scroll-smooth">
      <div class="max-w-3xl mx-auto space-y-6" id="messages-wrapper">
        <!-- Messages rendered via JS -->
      </div>
    </div>

    <!-- Input Form -->
    <div class="p-4 bg-gradient-to-t from-[#111216] via-[#111216] to-transparent">
      <div class="max-w-3xl mx-auto">
        <form id="chat-form" class="relative flex flex-col bg-[#1a1c23] border border-gray-700/80 focus-within:border-blue-500/80 rounded-2xl shadow-lg transition">
          <textarea
            id="message-input"
            rows="1"
            placeholder="Nhập tin nhắn... (Enter để gửi, Shift + Enter để xuống dòng)"
            class="w-full bg-transparent px-4 pt-3.5 pb-2 text-sm text-gray-100 placeholder-gray-400 resize-none outline-none max-h-48 custom-scrollbar leading-relaxed"
          ></textarea>

          <div class="flex items-center justify-between px-3 pb-2.5 pt-1">
            <span class="text-[11px] text-gray-400 flex items-center gap-1">
              <i data-lucide="corner-down-left" class="w-3 h-3 text-gray-400"></i> Enter để gửi
            </span>
            <button
              type="submit"
              id="btn-send"
              disabled
              class="p-2 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-500 text-white rounded-xl transition active:scale-95 disabled:cursor-not-allowed"
              title="Gửi tin nhắn"
            >
              <i data-lucide="arrow-up" class="w-4 h-4 stroke-[2.5]"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
    <div class="bg-[#181a20] border border-gray-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col">
      <div class="px-5 py-4 border-b border-gray-800 flex items-center justify-between bg-[#14161b]">
        <div class="flex items-center gap-2">
          <i data-lucide="sliders" class="w-4 h-4 text-blue-400"></i>
          <h3 class="font-semibold text-sm text-gray-100">Cấu hình Coze Bot</h3>
        </div>
        <button id="btn-close-settings" class="p-1 text-gray-400 hover:text-white rounded-lg">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="p-5 space-y-4 text-sm">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1.5">
            Personal Access Token (PAT)
          </label>
          <input 
            type="password" 
            id="setting-api-key" 
            placeholder="pat_xxxxxxxxxxxxxxxxxxxxxxxx"
            class="w-full bg-[#111216] border border-gray-700 text-gray-200 rounded-xl px-3.5 py-2.5 outline-none focus:border-blue-500 font-mono text-xs"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1.5">
            Bot ID
          </label>
          <input 
            type="text" 
            id="setting-bot-id" 
            placeholder="Ví dụ: 7320000000000000000"
            class="w-full bg-[#111216] border border-gray-700 text-gray-200 rounded-xl px-3.5 py-2.5 outline-none focus:border-blue-500 font-mono text-xs"
          >
        </div>

        <p class="text-[11px] text-gray-400 bg-gray-800/40 p-2.5 rounded-lg border border-gray-700/50 leading-relaxed">
          💡 <strong>Gợi ý:</strong> Nếu máy chủ đã cấu hình sẵn biến môi trường <code class="text-blue-400">COZE_API_KEY</code> và <code class="text-blue-400">COZE_BOT_ID</code>, bạn có thể để trống mục này.
        </p>
      </div>

      <div class="px-5 py-3.5 border-t border-gray-800 bg-[#14161b] flex items-center justify-end gap-2">
        <button id="btn-cancel-settings" class="px-4 py-2 text-xs font-medium text-gray-400 hover:text-white rounded-xl">
          Hủy
        </button>
        <button id="btn-save-settings" class="px-4 py-2 text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition">
          Lưu cấu hình
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-[#1e2330] border border-gray-700 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all pointer-events-none">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400 shrink-0"></i>
    <span id="toast-message">Đã lưu!</span>
  </div>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
